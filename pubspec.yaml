name: bubbl_flutter_sdk_example
description: Bubbl Flutter SDK public example app with full method coverage.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  bubbl_flutter_sdk:
    git:
      url: https://github.com/bubbl-repo/bubbl_flutter_sdk.git
      ref: v0.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
